<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <rect width="800" height="360" fill="#0e0e0e"/>

  <!-- Grid background -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
  </g>

  <!-- Central referent node -->
  <circle cx="400" cy="180" r="28" fill="none" stroke="#505050" stroke-width="1.5"/>
  <text x="400" y="176" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#707070" text-anchor="middle" letter-spacing="1">TECH</text>
  <text x="400" y="189" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#707070" text-anchor="middle" letter-spacing="1">REF</text>

  <!-- Satellite nodes -->
  <!-- Top -->
  <circle cx="400" cy="80" r="16" fill="none" stroke="#2e2e2e" stroke-width="1"/>
  <text x="400" y="84" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#404040" text-anchor="middle">arch</text>
  <line x1="400" y1="152" x2="400" y2="96" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Bottom -->
  <circle cx="400" cy="280" r="16" fill="none" stroke="#2e2e2e" stroke-width="1"/>
  <text x="400" y="284" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#404040" text-anchor="middle">code</text>
  <line x1="400" y1="208" x2="400" y2="264" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Left -->
  <circle cx="220" cy="180" r="16" fill="none" stroke="#2e2e2e" stroke-width="1"/>
  <text x="220" y="184" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#404040" text-anchor="middle">team</text>
  <line x1="372" y1="180" x2="236" y2="180" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Right -->
  <circle cx="580" cy="180" r="16" fill="none" stroke="#2e2e2e" stroke-width="1"/>
  <text x="580" y="184" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#404040" text-anchor="middle">prod</text>
  <line x1="428" y1="180" x2="564" y2="180" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Top-left -->
  <circle cx="260" cy="100" r="14" fill="none" stroke="#252525" stroke-width="1"/>
  <text x="260" y="104" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#383838" text-anchor="middle">review</text>
  <line x1="376" y1="158" x2="272" y2="112" stroke="#252525" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Top-right -->
  <circle cx="540" cy="100" r="14" fill="none" stroke="#252525" stroke-width="1"/>
  <text x="540" y="104" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#383838" text-anchor="middle">design</text>
  <line x1="424" y1="158" x2="528" y2="112" stroke="#252525" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Bottom-left -->
  <circle cx="260" cy="260" r="14" fill="none" stroke="#252525" stroke-width="1"/>
  <text x="260" y="264" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#383838" text-anchor="middle">debug</text>
  <line x1="376" y1="202" x2="272" y2="248" stroke="#252525" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Bottom-right -->
  <circle cx="540" cy="260" r="14" fill="none" stroke="#252525" stroke-width="1"/>
  <text x="540" y="264" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#383838" text-anchor="middle">mentor</text>
  <line x1="424" y1="202" x2="528" y2="248" stroke="#252525" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
