<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <rect width="800" height="360" fill="#0e0e0e"/>

  <!-- Grid background -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
  </g>

  <!-- Source node -->
  <rect x="80" y="156" width="100" height="48" rx="2" fill="none" stroke="#2e2e2e" stroke-width="1"/>
  <text x="130" y="175" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#505050" text-anchor="middle" letter-spacing="1">SOURCE</text>
  <text x="130" y="191" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">db / api</text>

  <!-- Arrow E -->
  <line x1="180" y1="180" x2="240" y2="180" stroke="#2e2e2e" stroke-width="1"/>
  <polygon points="240,175 250,180 240,185" fill="#2e2e2e"/>
  <text x="207" y="172" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">E</text>

  <!-- Warehouse node -->
  <rect x="250" y="144" width="120" height="72" rx="2" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <text x="310" y="168" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#505050" text-anchor="middle" letter-spacing="1">WAREHOUSE</text>
  <text x="310" y="185" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">raw land</text>
  <text x="310" y="201" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2e2e2e" text-anchor="middle">+ transform</text>

  <!-- Arrow L -->
  <line x1="370" y1="180" x2="430" y2="180" stroke="#2e2e2e" stroke-width="1"/>
  <polygon points="430,175 440,180 430,185" fill="#2e2e2e"/>
  <text x="397" y="172" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">L</text>

  <!-- Transform arrow T -->
  <line x1="370" y1="156" x2="430" y2="100" stroke="#2e2e2e" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="426,94 436,98 430,108" fill="#2e2e2e"/>
  <text x="393" y="122" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">T</text>

  <!-- Output node 1 — marts -->
  <rect x="440" y="156" width="100" height="48" rx="2" fill="none" stroke="#404040" stroke-width="1"/>
  <text x="490" y="175" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#606060" text-anchor="middle" letter-spacing="1">MARTS</text>
  <text x="490" y="191" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#444444" text-anchor="middle">model_v3</text>

  <!-- Output node 2 — sprawl (dashed, warning) -->
  <rect x="440" y="72" width="100" height="48" rx="2" fill="none" stroke="#503030" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="490" y="91" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#7a5050" text-anchor="middle" letter-spacing="1">MARTS</text>
  <text x="490" y="107" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5a3a3a" text-anchor="middle">model_v7?</text>

  <!-- Arrow to BI -->
  <line x1="540" y1="180" x2="610" y2="180" stroke="#404040" stroke-width="1"/>
  <polygon points="610,175 620,180 610,185" fill="#404040"/>

  <!-- BI node -->
  <rect x="620" y="156" width="100" height="48" rx="2" fill="none" stroke="#484848" stroke-width="1"/>
  <text x="670" y="175" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#686868" text-anchor="middle" letter-spacing="1">BI / DASH</text>
  <text x="670" y="191" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#505050" text-anchor="middle">which number?</text>

  <!-- Question marks floating -->
  <text x="560" y="260" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#2e2e2e">??</text>
  <text x="320" y="290" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#2e2e2e">??</text>
</svg>
